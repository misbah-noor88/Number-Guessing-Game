
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <div class="game-icon">🎯</div>

        <h1>Guess The Number</h1>

        <p class="subtitle">
            Can you guess the secret number?
        </p>

        <div class="range">
            <span>1</span>
            <span>TO</span>
            <span>100</span>
        </div>

        <input
            type="number"
            id="guessInput"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button id="checkBtn" onclick="checkGuess()">
            Check Number
        </button>

        <p id="message">Let's start the game! 🚀</p>

        <div class="attempts">
            Attempts: <span id="attempts">0</span>
        </div>

        <button id="restartBtn" onclick="restartGame()">
            ↻ New Game
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
